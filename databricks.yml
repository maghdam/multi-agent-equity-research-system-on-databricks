# This is a Declarative Automation Bundle definition for multi-agent-equity-research-system-on-databricks.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: multi-agent-equity-research-system-on-databricks

include:
  - resources/*.yml

variables:
  data_catalog:
    description: Unity Catalog catalog containing the project schemas.
    default: workspace
  bronze_schema:
    description: Unity Catalog schema containing raw Bronze datasets.
    default: equity_research_bronze
  silver_schema:
    description: Unity Catalog schema containing validated Silver datasets.
    default: equity_research_silver
  gold_schema:
    description: Unity Catalog schema containing analytical Gold datasets.
    default: equity_research_gold
  ai_schema:
    description: Unity Catalog schema containing AI retrieval datasets and indexes.
    default: equity_research_ai
  alpaca_secret_scope:
    description: Databricks secret scope containing the Alpaca credentials.
    default: equity-research-dev
  vector_search_endpoint_name:
    description: Existing Databricks AI Search endpoint used by the RAG index.
    default: vector_search_endpoint
  embedding_model_endpoint_name:
    description: Databricks embedding endpoint used for document and query embeddings.
    default: databricks-gte-large-en

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-5e700074-422e.cloud.databricks.com

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://dbc-5e700074-422e.cloud.databricks.com
