# This is a Declarative Automation Bundle definition for multi-agent-equity-research-system-on-databricks.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: multi-agent-equity-research-system-on-databricks

include:
  - resources/*.yml

variables:
  data_catalog:
    description: Unity Catalog catalog containing the medallion schemas.
    default: workspace
  bronze_schema:
    description: Unity Catalog schema containing raw Bronze datasets.
    default: equity_research_bronze
  silver_schema:
    description: Unity Catalog schema containing validated Silver datasets.
    default: equity_research_silver
  alpaca_secret_scope:
    description: Databricks secret scope containing the Alpaca credentials.
    default: equity-research-dev

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-5e700074-422e.cloud.databricks.com

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://dbc-5e700074-422e.cloud.databricks.com
