resources:
  jobs:
    silver_price_transformation:
      name: ${bundle.name}-silver-price-transformation
      description: >-
        Rebuilds the validated current daily-price snapshot from immutable
        Bronze Alpaca response history.

      max_concurrent_runs: 1

      tasks:
        - task_key: transform_silver_prices

          notebook_task:
            notebook_path: ../src/silver_price_transformation.py

            base_parameters:
              catalog: ${resources.schemas.silver.catalog_name}
              bronze_schema: ${resources.schemas.bronze.name}
              silver_schema: ${resources.schemas.silver.name}

          timeout_seconds: 300