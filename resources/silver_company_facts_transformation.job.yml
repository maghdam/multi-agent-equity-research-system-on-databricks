resources:
  jobs:
    silver_company_facts_transformation:
      name: ${bundle.name}-silver-company-facts-transformation
      description: >-
        Rebuilds the validated current SEC company-facts snapshot from
        immutable Bronze SEC Company Facts response history.

      max_concurrent_runs: 1

      tasks:
        - task_key: transform_silver_company_facts

          notebook_task:
            notebook_path: ../src/silver_company_facts_transformation.py

            base_parameters:
              catalog: ${resources.schemas.silver.catalog_name}
              bronze_schema: ${resources.schemas.bronze.name}
              silver_schema: ${resources.schemas.silver.name}

          timeout_seconds: 300
