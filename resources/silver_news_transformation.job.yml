resources:
  jobs:
    silver_news_transformation:
      name: ${bundle.name}-silver-news-transformation
      description: >-
        Rebuilds the validated current company-news snapshot from immutable
        Bronze Alpaca response history.

      max_concurrent_runs: 1

      tasks:
        - task_key: transform_silver_news

          notebook_task:
            notebook_path: ../src/silver_news_transformation.py

            base_parameters:
              catalog: ${resources.schemas.silver.catalog_name}
              bronze_schema: ${resources.schemas.bronze.name}
              silver_schema: ${resources.schemas.silver.name}

          timeout_seconds: 300