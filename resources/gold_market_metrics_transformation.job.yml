resources:
  jobs:
    gold_market_metrics_transformation:
      name: ${bundle.name}-gold-market-metrics-transformation
      description: >-
        Rebuilds the current comparable market-metrics snapshot from
        validated Silver daily-price history.

      max_concurrent_runs: 1

      tasks:
        - task_key: transform_gold_market_metrics

          notebook_task:
            notebook_path: ../src/gold_market_metrics_transformation.py

            base_parameters:
              catalog: ${resources.schemas.gold.catalog_name}
              silver_schema: ${resources.schemas.silver.name}
              gold_schema: ${resources.schemas.gold.name}

          timeout_seconds: 300
