resources:
  apps:
    equity_research:
      name: equity-research-${bundle.target}
      description: Multi-agent equity research workspace with grounded reports.
      source_code_path: ..
      resources:
        - name: mlflow-experiment
          description: Managed MLflow experiment for production application traces.
          experiment:
            experiment_id: ${resources.experiments.app_production_traces.id}
            permission: CAN_EDIT

        - name: trace-annotations
          description: Unity Catalog annotations for production MLflow traces.
          uc_securable:
            securable_full_name: ${resources.schemas.ai.catalog_name}.${resources.schemas.ai.name}.app_production_otel_annotations
            securable_type: TABLE
            permission: MODIFY

        - name: trace-logs
          description: Unity Catalog logs for production MLflow traces.
          uc_securable:
            securable_full_name: ${resources.schemas.ai.catalog_name}.${resources.schemas.ai.name}.app_production_otel_logs
            securable_type: TABLE
            permission: MODIFY

        - name: trace-metrics
          description: Unity Catalog metrics for production MLflow traces.
          uc_securable:
            securable_full_name: ${resources.schemas.ai.catalog_name}.${resources.schemas.ai.name}.app_production_otel_metrics
            securable_type: TABLE
            permission: MODIFY

        - name: trace-spans
          description: Unity Catalog spans for production MLflow traces.
          uc_securable:
            securable_full_name: ${resources.schemas.ai.catalog_name}.${resources.schemas.ai.name}.app_production_otel_spans
            securable_type: TABLE
            permission: MODIFY

        - name: sql-warehouse
          description: Read-only SQL compute for controlled Gold queries.
          sql_warehouse:
            id: ${var.app_sql_warehouse_id}
            permission: CAN_USE

        - name: market-metrics
          description: Controlled Gold market metrics used by the application.
          uc_securable:
            securable_full_name: ${resources.schemas.gold.catalog_name}.${resources.schemas.gold.name}.market_metrics
            securable_type: TABLE
            permission: SELECT

        - name: fundamental-metrics
          description: Controlled Gold fundamental metrics used by the application.
          uc_securable:
            securable_full_name: ${resources.schemas.gold.catalog_name}.${resources.schemas.gold.name}.fundamental_metrics
            securable_type: TABLE
            permission: SELECT

        - name: daily-prices
          description: Validated Silver daily prices used for app price-history charts.
          uc_securable:
            securable_full_name: ${resources.schemas.silver.catalog_name}.${resources.schemas.silver.name}.daily_prices
            securable_type: TABLE
            permission: SELECT

        - name: research-index
          description: Managed AI Search index used for grounded company research.
          uc_securable:
            securable_full_name: ${resources.vector_search_indexes.research_chunks.name}
            securable_type: TABLE
            permission: SELECT
